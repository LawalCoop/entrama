<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe del Debate - Alimentos Cooperativos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-fondo: #0a0a0a;
            --color-card: #141414;
            --color-card-hover: #1a1a1a;
            --color-borde: #262626;
            --color-texto: #fafafa;
            --color-texto-secundario: #a1a1aa;
            --color-texto-terciario: #71717a;
            --color-primario: #6ba54a;
            --color-primario-soft: rgba(107, 165, 74, 0.1);
            --color-success: #22c55e;
            --color-warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--color-fondo);
            color: var(--color-texto);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Fondo animado */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(236, 72, 153, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        /* Container principal */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 4rem 2rem;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .header img {
            height: 80px;
            margin-bottom: 2rem;
            filter: drop-shadow(0 4px 20px rgba(107, 165, 74, 0.3));
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .header .subtitulo {
            font-size: 1.25rem;
            color: var(--color-texto-secundario);
            font-weight: 400;
        }

        .header .ubicacion {
            color: var(--color-texto-terciario);
            font-size: 1rem;
            margin-top: 0.5rem;
        }

        .header .fecha {
            color: var(--color-primario);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        /* Stats grandes */
        .stats-container {
            display: flex;
            justify-content: center;
            gap: 4rem;
            margin: 3rem 0;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .stat-box {
            text-align: center;
            padding: 2rem;
            background: var(--color-card);
            border: 1px solid var(--color-borde);
            border-radius: 20px;
            min-width: 180px;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            transform: translateY(-5px);
            border-color: var(--color-primario);
            box-shadow: 0 20px 40px rgba(107, 165, 74, 0.15);
        }

        .stat-numero {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-primario) 0%, #a3d977 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .stat-label {
            color: var(--color-texto-secundario);
            font-size: 1rem;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }

        /* Lista de cooperativas */
        /* Bloques del resumen: el tema y la metodología, arriba de todo. */
        .bloque-tema,
        .bloque-metodo {
            background: var(--color-card);
            border: 1px solid var(--color-borde);
            border-radius: 16px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        .bloque-titulo {
            color: var(--color-texto-secundario);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1.2rem;
            font-weight: 500;
        }

        .tema-grande {
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1.5rem;
        }

        /* De qué se trató el encuentro, antes de las preguntas. Un poco más
           grande que el cuerpo del resto: es lo que le da sentido a todo lo que
           viene abajo, y quien abre el informe meses después llega sin contexto. */
        .tema-contexto {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
            max-width: 70ch;
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--color-texto-secundario);
        }

        .tema-contexto strong {
            color: var(--color-texto);
            font-weight: 600;
        }

        .bloque-bajada {
            color: var(--color-texto-secundario);
            margin-bottom: 1rem;
        }

        /* Los pasos de la metodología. `ol` para que el orden sea el del
           procedimiento y no una lista suelta de cosas que pasaron. */
        .pasos {
            list-style: none;
            counter-reset: paso;
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
        }

        .pasos li {
            counter-increment: paso;
            display: grid;
            grid-template-columns: 2.2rem 1fr;
            gap: 0.9rem;
            align-items: start;
        }

        .pasos li::before {
            content: counter(paso);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.2rem;
            height: 2.2rem;
            border-radius: 50%;
            background: var(--color-primario-soft);
            color: var(--color-primario);
            font-weight: 700;
            font-size: 0.95rem;
        }

        /* Los dos van a la segunda columna. Sin esto el `span` cae en la celda
           de abajo del número —2,2rem de ancho— y el texto sale en vertical,
           una palabra por línea. */
        .pasos strong,
        .pasos span {
            grid-column: 2;
        }

        .pasos strong {
            font-size: 1.05rem;
            margin-bottom: 0.2rem;
        }

        .pasos span {
            color: var(--color-texto-secundario);
            line-height: 1.5;
        }

        .nota-herramienta {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--color-borde);
            color: var(--color-texto-secundario);
            line-height: 1.6;
        }

        /* Tarjetero: quiénes estuvieron y cómo ubicarlos. */
        .tarjetero { margin: 4rem 0 2rem; }

        .tarjetero-titulo {
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .tarjetero-bajada {
            color: var(--color-texto-secundario);
            margin-bottom: 2rem;
        }

        /* auto-fill y no auto-fit: con pocas tarjetas, auto-fit las estira hasta
           ocupar todo el ancho y una sola queda del tamaño de la pantalla. */
        .tarjetas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
        }

        .tarjeta {
            background: var(--color-card);
            border: 1px solid var(--color-borde);
            border-radius: 14px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            transition: border-color 0.2s ease;
        }

        .tarjeta:hover { border-color: var(--color-primario); }

        .tarjeta-nombre {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .tarjeta-org {
            color: var(--color-primario);
            font-size: 0.95rem;
            line-height: 1.3;
        }

        .tarjeta-donde {
            color: var(--color-texto-secundario);
            font-size: 0.85rem;
        }

        .tarjeta-acts {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-top: 0.35rem;
        }

        .tarjeta-act {
            background: var(--color-primario-soft);
            color: var(--color-primario);
            padding: 0.2rem 0.6rem;
            border-radius: 100px;
            font-size: 0.75rem;
        }

        .tarjeta-contacto {
            margin-top: 0.6rem;
            padding-top: 0.6rem;
            border-top: 1px solid var(--color-borde);
            color: var(--color-texto);
            font-size: 0.85rem;
            text-decoration: none;
            word-break: break-all;
        }

        .tarjeta-contacto:hover { color: var(--color-primario); }

        .tarjeta-sin-contacto {
            margin-top: 0.6rem;
            padding-top: 0.6rem;
            border-top: 1px solid var(--color-borde);
            color: var(--color-texto-terciario);
            font-size: 0.8rem;
            font-style: italic;
        }

        .coops-lista {
            text-align: center;
            padding: 2rem;
            background: var(--color-card);
            border: 1px solid var(--color-borde);
            border-radius: 16px;
            margin-bottom: 4rem;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .coops-lista h3 {
            color: var(--color-texto-secundario);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .coops-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
        }

        .coop-tag {
            background: var(--color-primario-soft);
            color: var(--color-primario);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid rgba(107, 165, 74, 0.2);
            transition: all 0.2s ease;
        }

        .coop-tag:hover {
            background: var(--color-primario);
            color: white;
        }

        /* Equipos */
        .equipos-grid {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .equipo-card {
            background: var(--color-card);
            border: 1px solid var(--color-borde);
            border-radius: 20px;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out both;
            transition: all 0.3s ease;
        }

        .equipo-card:hover {
            border-color: var(--color-borde);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .equipo-header {
            padding: 2rem;
            border-bottom: 1px solid var(--color-borde);
            position: relative;
            overflow: hidden;
        }

        .equipo-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--equipo-color);
        }

        .equipo-nombre {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--equipo-color);
            margin-bottom: 0.5rem;
        }

        .equipo-tema {
            color: var(--color-texto-secundario);
            font-size: 1.1rem;
        }

        .equipo-body {
            padding: 2rem;
        }

        .seccion {
            margin-bottom: 2rem;
        }

        .seccion:last-child {
            margin-bottom: 0;
        }

        .seccion-titulo {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--color-texto-terciario);
            margin-bottom: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .seccion-titulo::before {
            content: '';
            width: 12px;
            height: 2px;
            background: var(--equipo-color);
            border-radius: 2px;
        }

        /* Preguntas */
        .preguntas-lista {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .pregunta-item {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border-left: 3px solid var(--equipo-color);
        }

        .pregunta-numero {
            color: var(--equipo-color);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .pregunta-texto {
            color: var(--color-texto);
        }

        /* Participantes */
        .participantes-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .participante-chip {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.5rem 1rem;
            border-radius: 100px;
            font-size: 0.85rem;
            color: var(--color-texto);
            border: 1px solid var(--color-borde);
        }

        .participante-chip .coop {
            color: var(--color-texto-terciario);
        }

        /* Cooperativas del equipo */
        .coops-equipo {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .coop-equipo-tag {
            background: rgba(255, 255, 255, 0.05);
            color: var(--color-texto-secundario);
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        /* Reflexion */
        .reflexion-box {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
            padding: 1.5rem;
            border-radius: 16px;
            border-left: 4px solid var(--equipo-color);
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--color-texto);
            white-space: pre-wrap;
        }

        /* Accionables */
        .accionables-lista {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .accionable-item {
            display: flex;
            gap: 1rem;
            padding: 1.25rem;
            background: rgba(34, 197, 94, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(34, 197, 94, 0.1);
        }

        .accionable-numero {
            background: var(--color-success);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .accionable-content {
            flex: 1;
        }

        .accionable-texto {
            color: var(--color-texto);
            margin-bottom: 0.5rem;
        }

        .accionable-responsable {
            color: var(--color-warning);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .accionable-responsable::before {
            content: '→';
        }

        /* Sin datos */
        .sin-datos {
            color: var(--color-texto-terciario);
            font-style: italic;
            padding: 1rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--color-texto-terciario);
            font-size: 0.85rem;
        }

        /* Pie de marca: "Powered by" con los dos logos. */
        .pie-marca {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-top: 0.75rem;
            font-size: 0.7rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            opacity: 0.65;
        }

        .pie-marca img {
            height: 13px;
            width: auto;
            display: block;
        }

        /* El logo de FACTTIC es de trazo más fino: a la misma altura que el de
           Lawal se lee menos, así que va un punto más grande. */
        .pie-marca img.logo-facttic { height: 15px; }

        .pie-marca a {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
        }

        /* Loading */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 1.5rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--color-borde);
            border-top-color: var(--color-primario);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Animaciones al hacer scroll */
        .animate-on-scroll {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .animate-on-scroll.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .animate-on-scroll.delay-1 { transition-delay: 0.1s; }
        .animate-on-scroll.delay-2 { transition-delay: 0.2s; }
        .animate-on-scroll.delay-3 { transition-delay: 0.3s; }

        /* Print styles */
        @media print {
            .bg-gradient { display: none; }
            body { background: white; color: black; }
            .equipo-card { break-inside: avoid; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .header h1 { font-size: 2rem; }
            .stats-container { flex-direction: column; gap: 1rem; align-items: center; }
            .stat-numero { font-size: 3rem; }
            .equipo-header, .equipo-body { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <div class="container">
        <div id="contenido">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando informe...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://niiflnildmljjcgkqmwd.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5paWZsbmlsZG1sampjZ2txbXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3OTY0NTksImV4cCI6MjEwMTM3MjQ1OX0.QZooFUiK-ZUn5OmSUvyFMYohHkw8ufXe3NmN4UsHNQU';

        var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        /*
         * Tipos de organización y actividades son tablas, no listas fijas: la
         * gente da de alta las que faltan desde el formulario. Copiarlas acá
         * garantizaba quedar desactualizado —y pasó: "confederacion" se cargó
         * en el encuentro y este informe la mostraba como slug crudo—.
         *
         * Se leen de la base y se resuelven por slug, que es lo que quedó
         * guardado en cada participante.
         */
        let catalogoActividades = [];
        let catalogoTipos = [];

        const nombreDeActividad = (slug) =>
            catalogoActividades.find(a => a.slug === slug)?.nombre || slug;

        const nombreDeTipo = (slug) =>
            catalogoTipos.find(t => t.slug === slug)?.nombre || slug;

        async function cargarDatos() {
            const [equiposRes, participantesRes, actividadesRes, tiposRes] = await Promise.all([
                supabase.from('facttic_equipos').select('*').eq('activo', true).order('orden'),
                supabase.from('facttic_participantes').select('*'),
                supabase.from('actividades').select('slug, nombre'),
                supabase.from('tipos_organizacion').select('slug, nombre')
            ]);

            const equipos = equiposRes.data || [];
            const participantes = participantesRes.data || [];
            catalogoActividades = actividadesRes.data || [];
            catalogoTipos = tiposRes.data || [];

            renderizar(equipos, participantes);
        }

        /*
         * Cuándo fue el encuentro.
         *
         * Estaba con `new Date()`, que ponía la fecha de hoy: el informe decía
         * haberse debatido el día en que uno lo abría. Es un dato del encuentro,
         * no del momento en que se mira, así que va fijo.
         *
         * Con `new Date(año, mes, día)` y no con un string: `new Date('2026-08-21')`
         * se interpreta como UTC y en Argentina cae el día anterior a las 21hs.
         * El mes va 0-indexado, así que 7 es agosto.
         */
        const FECHA_DEL_ENCUENTRO = new Date(2026, 7, 21);

        function renderizar(equipos, participantes) {
            const fecha = FECHA_DEL_ENCUENTRO.toLocaleDateString('es-AR', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });

            // Deduplicar personas (case insensitive)
            const personasMap = new Map();
            participantes.forEach(p => {
                const key = (p.nombre + '|' + p.cooperativa).toLowerCase().trim();
                if (!personasMap.has(key)) personasMap.set(key, p);
            });
            const totalPersonas = personasMap.size;

            // Deduplicar cooperativas (case insensitive)
            const coopMap = new Map();
            participantes.forEach(p => {
                const key = p.cooperativa.toLowerCase().trim();
                if (!coopMap.has(key)) coopMap.set(key, p.cooperativa);
            });
            const todasCooperativas = [...coopMap.values()].sort();
            const totalCooperativas = todasCooperativas.length;

            const personas = [...personasMap.values()];

            // El resto del resumen. `filter(Boolean)` en todos: lo que se cargó
            // antes de que el formulario pidiera estos datos viene en null, y no
            // tiene que contar como una categoría más.
            const provincias = new Set(personas.map(x => x.provincia).filter(Boolean));
            const tiposOrg = new Set(personas.map(x => x.familia_organizacion || x.tipo_organizacion).filter(Boolean));
            const actividades = new Set(personas.flatMap(x => x.actividades || []).filter(Boolean));
            const totalAccionables = equipos.reduce(
                (n, e) => n + (e.accionables || []).filter(a => a && a.trim()).length, 0);

            /**
             * El tema y las preguntas, cuando son los mismos para todos.
             *
             * En este encuentro los cinco equipos debatieron lo mismo, así que
             * repetirlo cinco veces era ruido. Pero si algún día cada equipo
             * tiene su tema —como en el plenario de FACTTIC, de donde viene esta
             * app— hay que volver a mostrarlo en cada uno o el informe pierde
             * justo el dato que los distingue. Por eso se detecta en vez de
             * asumirse.
             */
            const unicoSiCoincide = (valores) => {
                const distintos = new Set(valores.map(v => JSON.stringify(v ?? null)));
                if (distintos.size !== 1) return null;
                const valor = JSON.parse([...distintos][0]);
                return (valor && valor.length) ? valor : null;
            };
            const temaComun = unicoSiCoincide(equipos.map(e => e.tema));
            const preguntasComunes = unicoSiCoincide(equipos.map(e => e.preguntas));

            let html = `
                <header class="header">
                    <img src="logo_alimentos_claro.png" alt="Alimentos Cooperativos">
                    <h1>Informe del Debate</h1>
                    <p class="subtitulo">Alimentos Cooperativos</p>
                    <p class="fecha">${fecha}</p>
                </header>

                <div class="stats-container animate-on-scroll">
                    ${[
                        [totalPersonas, 'Personas'],
                        [totalCooperativas, 'Organizaciones'],
                        [provincias.size, provincias.size === 1 ? 'Provincia' : 'Provincias'],
                        [tiposOrg.size, tiposOrg.size === 1 ? 'Tipo de organización' : 'Tipos de organización'],
                        [equipos.length, equipos.length === 1 ? 'Equipo' : 'Equipos'],
                        [totalAccionables, 'Accionables']
                    ].filter(([n]) => n > 0).map(([n, etiqueta]) => `
                        <div class="stat-box">
                            <div class="stat-numero">${n}</div>
                            <div class="stat-label">${etiqueta}</div>
                        </div>
                    `).join('')}
                </div>

                ${temaComun ? `
                    <section class="bloque-tema animate-on-scroll">
                        <h3 class="bloque-titulo">El tema</h3>
                        <p class="tema-grande">${temaComun}</p>

                        <div class="tema-contexto">
                            <p>
                                El encuentro se convocó como una nueva jornada nacional de trabajo y
                                planificación: reunirse para seguir diseñando el sostenimiento de las
                                organizaciones, y también para pensar y diagramar un futuro que
                                permita crecer en la <strong>Resistencia y la Reconstrucción</strong>
                                del modelo alternativo de la Economía Solidaria.
                            </p>
                            <p>
                                La consigna fue trabajar sobre herramientas concretas frente a la
                                crisis. Alrededor de eso debatieron los equipos: qué se está haciendo
                                hoy que permite resistir, qué de eso está funcionando, y qué hace
                                falta para dar el paso de la resistencia a la reconstrucción.
                            </p>
                        </div>

                        ${preguntasComunes ? `
                            <p class="bloque-bajada">Todos los equipos debatieron las mismas preguntas:</p>
                            <div class="preguntas-lista">
                                ${preguntasComunes.map((q, i) => `
                                    <div class="pregunta-item">
                                        <span class="pregunta-numero">${i + 1}.</span>
                                        <span class="pregunta-texto">${q.trim()}</span>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </section>
                ` : ''}

                <section class="bloque-metodo animate-on-scroll">
                    <h3 class="bloque-titulo">Cómo se trabajó</h3>
                    <ol class="pasos">
                        <li>
                            <strong>Cada quien se anotó desde su celular</strong>
                            <span>Nombre, organización, provincia, tipo de organización y actividad.</span>
                        </li>
                        <li>
                            <strong>Los equipos los armó un algoritmo, no el azar</strong>
                            <span>Buscando que en cada uno no se repita la organización, que se crucen tipos distintos, que se mezclen las actividades y que queden parejos en cantidad.</span>
                        </li>
                        <li>
                            <strong>Dos horas de debate en cada equipo</strong>
                            <span>Sobre las preguntas disparadoras, con un mismo tiempo para todos marcado desde el panel y proyectado en la sala.</span>
                        </li>
                        <li>
                            <strong>Las conclusiones se cargaron ahí mismo</strong>
                            <span>Una reflexión del grupo y los accionables con sus responsables, desde el celular de cualquiera del equipo.</span>
                        </li>
                        <li>
                            <strong>Una hora para compartirlas en plenario</strong>
                            <span>Cada equipo presentó lo suyo, proyectando lo que había cargado.</span>
                        </li>
                    </ol>
                    <p class="nota-herramienta">
                        Este informe no lo transcribió nadie: se arma solo con lo que los equipos
                        cargaron durante el encuentro, y se actualiza cuando algo cambia. La
                        sistematización —que suele ser el trabajo que queda para después y a veces
                        no llega— quedó hecha al terminar.
                    </p>
                </section>

                <div class="coops-lista animate-on-scroll">
                    <h3>Organizaciones participantes</h3>
                    <div class="coops-tags">
                        ${todasCooperativas.map(c => `<span class="coop-tag">${c}</span>`).join('')}
                    </div>
                </div>

                <div class="equipos-grid">
            `;

            equipos.forEach((equipo, index) => {
                const participantesRaw = participantes.filter(p => p.equipo_id === equipo.id);

                // Deduplicar participantes del equipo
                const partMap = new Map();
                participantesRaw.forEach(p => {
                    const key = (p.nombre + '|' + p.cooperativa).toLowerCase().trim();
                    if (!partMap.has(key)) partMap.set(key, p);
                });
                const participantesEquipo = [...partMap.values()];

                // Deduplicar cooperativas del equipo
                const coopMapEquipo = new Map();
                participantesEquipo.forEach(p => {
                    const key = p.cooperativa.toLowerCase().trim();
                    if (!coopMapEquipo.has(key)) coopMapEquipo.set(key, p.cooperativa);
                });
                const cooperativas = [...coopMapEquipo.values()];

                const preguntas = equipo.preguntas || [];
                const accionables = equipo.accionables || [];
                const responsables = equipo.responsables || [];

                html += `
                    <article class="equipo-card animate-on-scroll" style="--equipo-color: ${equipo.color}">
                        <div class="equipo-header">
                            <h2 class="equipo-nombre">${equipo.nombre}</h2>
                            ${temaComun ? '' : `<p class="equipo-tema">${equipo.tema || ''}</p>`}
                        </div>
                        <div class="equipo-body">
                            ${preguntasComunes ? '' : `
                            <div class="seccion">
                                <h3 class="seccion-titulo">Preguntas disparadoras</h3>
                                ${preguntas.length > 0 ? `
                                    <div class="preguntas-lista">
                                        ${preguntas.map((p, i) => `
                                            <div class="pregunta-item">
                                                <span class="pregunta-numero">${i + 1}.</span>
                                                <span class="pregunta-texto">${p}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : '<p class="sin-datos">Sin preguntas</p>'}
                            </div>
                            `}

                            <div class="seccion">
                                <h3 class="seccion-titulo">Participantes (${participantesEquipo.length})</h3>
                                ${participantesEquipo.length > 0 ? `
                                    <div class="participantes-grid">
                                        ${participantesEquipo.map(p => `
                                            <span class="participante-chip">${p.nombre} <span class="coop">(${p.cooperativa})</span></span>
                                        `).join('')}
                                    </div>
                                ` : '<p class="sin-datos">Sin participantes</p>'}
                            </div>

                            <div class="seccion">
                                <h3 class="seccion-titulo">Organizaciones (${cooperativas.length})</h3>
                                ${cooperativas.length > 0 ? `
                                    <div class="coops-equipo">
                                        ${cooperativas.map(c => `<span class="coop-equipo-tag">${c}</span>`).join('')}
                                    </div>
                                ` : '<p class="sin-datos">Sin cooperativas</p>'}
                            </div>

                            <div class="seccion">
                                <h3 class="seccion-titulo">Reflexión del grupo</h3>
                                ${equipo.reflexion ? `
                                    <div class="reflexion-box">${equipo.reflexion}</div>
                                ` : '<p class="sin-datos">Sin reflexión cargada</p>'}
                            </div>

                            <div class="seccion">
                                <h3 class="seccion-titulo">Accionables</h3>
                                ${accionables.filter(a => a && a.trim()).length > 0 ? `
                                    <div class="accionables-lista">
                                        ${accionables.map((acc, i) => {
                                            if (!acc || !acc.trim()) return '';
                                            return `
                                                <div class="accionable-item">
                                                    <span class="accionable-numero">${i + 1}</span>
                                                    <div class="accionable-content">
                                                        <p class="accionable-texto">${acc}</p>
                                                        ${responsables[i] ? `<p class="accionable-responsable">${responsables[i]}</p>` : ''}
                                                    </div>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                ` : '<p class="sin-datos">Sin accionables cargados</p>'}
                            </div>
                        </div>
                    </article>
                `;
            });

            // --- Tarjetero ---
            //
            // Ordenado por organización y después por nombre: la gente busca
            // "el de tal cooperativa" antes que a una persona suelta, y así los
            // de la misma casa quedan juntos.
            const tarjetas = [...personas].sort((a, b) => {
                const porOrg = (a.cooperativa || '').localeCompare(b.cooperativa || '', 'es', { sensitivity: 'base' });
                return porOrg !== 0 ? porOrg : (a.nombre || '').localeCompare(b.nombre || '', 'es', { sensitivity: 'base' });
            });

            html += `
                </div>

                <section class="tarjetero animate-on-scroll">
                    <h2 class="tarjetero-titulo">Tarjetero intercoop</h2>
                    <p class="tarjetero-bajada">
                        Quiénes estuvieron, de dónde y a qué se dedican. El contacto aparece
                        en las tarjetas de quienes lo dejaron al anotarse.
                    </p>
                    <div class="tarjetas">
                        ${tarjetas.map(t => {
                            const tipo = nombreDeTipo(t.tipo_organizacion);
                            const acts = (t.actividades || []).map(a => nombreDeActividad(a));
                            return `
                                <article class="tarjeta">
                                    <p class="tarjeta-nombre">${t.nombre}</p>
                                    <p class="tarjeta-org">${t.cooperativa}</p>
                                    ${(tipo || t.provincia) ? `
                                        <p class="tarjeta-donde">${[tipo, t.provincia].filter(Boolean).join(' · ')}</p>
                                    ` : ''}
                                    ${acts.length ? `
                                        <div class="tarjeta-acts">
                                            ${acts.map(a => `<span class="tarjeta-act">${a}</span>`).join('')}
                                        </div>
                                    ` : ''}
                                    ${t.email ? `
                                        <a class="tarjeta-contacto" href="${'mailto:' + t.email}">${t.email}</a>
                                    ` : '<p class="tarjeta-sin-contacto">Sin contacto cargado</p>'}
                                </article>
                            `;
                        }).join('')}
                    </div>
                </section>

                <footer class="footer">
                    <p>Alimentos Cooperativos</p>
                    <p class="pie-marca">
                        <span>Powered by</span>
                        <a href="https://lawal.coop" target="_blank" rel="noopener noreferrer"><img src="logo_lawal_claro.png" alt="Lawal"></a>
                        <span>y</span>
                        <a href="https://facttic.org.ar" target="_blank" rel="noopener noreferrer"><img class="logo-facttic" src="logo_facttic.png" alt="FACTTIC"></a>
                    </p>
                </footer>
            `;

            document.getElementById('contenido').innerHTML = html;

            // Activar animaciones al scroll
            initScrollAnimations();
        }

        function initScrollAnimations() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            });

            document.querySelectorAll('.animate-on-scroll').forEach(el => {
                observer.observe(el);
            });
        }

        cargarDatos();
    </script>
</body>
</html>
